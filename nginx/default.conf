server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-style fallback for direct paths (static site; index is enough)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /images/manifest.json {
        add_header Cache-Control "no-store";
    }

    # Static family site — no eval, no inline scripts. Scripts are same-origin .js files only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
