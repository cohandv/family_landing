server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-style fallback for direct paths (static site; index is enough)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /images/manifest.json {
        add_header Cache-Control "no-store";
    }

    # No Content-Security-Policy here — Cloudflare may add its own. A strict origin CSP
    # combined with CF features (Rocket Loader, email obfuscation, bot scripts) causes
    # "blocks eval" and "blocks some resources" errors. Configure those in Cloudflare instead.

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
