server {
    listen 80;
    server_name _;

    # /about/styles.css  →  /usr/share/nginx/html/styles.css
    # The URL keeps /about; nginx strips that prefix before looking up files.
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 301 /about/;
    }

    location = /about {
        return 301 /about/;
    }

    location /about/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /about/index.html;
    }

    location = /about/images/manifest.json {
        alias /usr/share/nginx/html/images/manifest.json;
        add_header Cache-Control "no-store";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
