<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/about/" />
    <title>Our Family</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="#about" data-i18n="logo">Our Family</a>
      <nav id="site-nav" class="site-nav" aria-label="Family sections"></nav>
      <div class="lang-switch" role="group" aria-labelledby="lang-switch-label">
        <span id="lang-switch-label" class="lang-switch__label" data-i18n="lang.label">Language</span>
        <button type="button" class="lang-btn" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" class="lang-btn" data-lang="es" aria-pressed="false">ES</button>
      </div>
    </header>

    <main class="snap-main">
      <section id="about" class="panel panel--hero" aria-labelledby="about-heading">
        <div class="panel__inner panel__inner--hero">
          <figure class="family-photo">
            <div id="family-carousel-root"></div>
          </figure>
          <div class="hero-copy">
            <p class="eyebrow" data-i18n="about.eyebrow">Welcome</p>
            <h1 id="about-heading" class="display" data-i18n="about.title">About our family</h1>
            <p class="lede" data-i18n="about.lede"></p>
            <p class="body-text" data-i18n="about.body"></p>
            <a class="scroll-hint" href="#david">
              <span data-i18n="about.cta">Meet the family</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M12 5v14M5 12l7 7 7-7"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
          </div>
        </div>
      </section>

      <div id="members-root"></div>
    </main>

    <footer class="site-footer">
      <p data-i18n="footer"></p>
    </footer>

    <script src="i18n.js"></script>
    <script src="family.js"></script>
    <script src="carousel.js"></script>
    <script src="main.js" defer></script>
  </body>
</html>
